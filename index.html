<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HugMind</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0B0B0F;
    font-family: 'Inter', sans-serif;
    color: #E4E4E8;
  }
  .container {
    text-align: center;
    padding: 40px;
  }
  .logo {
    max-width: 420px;
    width: 90vw;
    border-radius: 12px;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 2px;
    color: #E4E4E8;
  }
  .dash-link {
    position: fixed;
    top: 16px;
    right: 20px;
    font-size: 11px;
    font-weight: 500;
    color: #7a7a88;
    text-decoration: none;
    letter-spacing: 1px;
    transition: color .2s;
  }
  .dash-link:hover { color: #C9A84C; }
</style>
</head>
<body>
  <a href="Hugmind-Dashboard.html" class="dash-link">Dashboard</a>
  <div class="container">
    <img src="HugMind Logo.jpeg" alt="HugMind" class="logo">
    <h1>Hello World</h1>
  </div>
</body>
</html>
